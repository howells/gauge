name: Release

# Every semver tag, not one literal version. This was `v3.0.0`, so it fired
# exactly once and then sat silent: v3.1.0 was tagged, nothing ran, and the
# release had to go out by hand. A trigger that only matches the release it was
# written for is one that has to be remembered at every future release, which is
# the thing automation is for. The tag-matches-package-version step below is
# what keeps the wildcard honest.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Verify tag matches package version
        run: test "${GITHUB_REF_NAME}" = "v$(node -p "require('./package.json').version")"
      - run: pnpm audit --audit-level high
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm coverage
      - run: pnpm coverage:critical
      - run: pnpm build
      - run: pnpm schema:check
      - run: pnpm docs:check
      - run: pnpm package:smoke
      - run: pnpm knip
      - run: pnpm publish --access public --provenance --no-git-checks
