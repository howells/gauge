name: Release

# Every semver tag, not one literal version. This was `v3.0.0`, so it fired
# exactly once and then sat silent: v3.1.0 was tagged, nothing ran, and the
# release had to go out by hand. A trigger that only matches the release it was
# written for is one that has to be remembered at every future release, which is
# the thing automation is for. The tag-matches-package-version step below is
# what keeps the wildcard honest.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Version comes from `packageManager` in package.json — one source of
      # truth, because naming it here as well is an error, not a belt-and-braces:
      # action-setup fails outright when the two disagree.
      #
      # That pin is 10.30.2, deliberately. Trusted publishing needs pnpm to let
      # the OIDC token win over the static `_authToken` setup-node writes, and
      # that fix (pnpm#11495) landed after 10.15.1 — so on the old pin an empty
      # token could suppress OIDC. pnpm 11 broke OIDC outright (pnpm#11566,
      # E404 on every package), so this must not drift upward past 10.x.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Verify tag matches package version
        run: test "${GITHUB_REF_NAME}" = "v$(node -p "require('./package.json').version")"
      - run: pnpm audit --audit-level high
      - run: pnpm typecheck
      - run: pnpm lint
      # Built before the suite runs, for the reason spelled out in ci.yml: some
      # of these tests read the built package.
      - run: pnpm build
      - run: pnpm coverage
      - run: pnpm coverage:critical
      - run: pnpm schema:check
      - run: pnpm docs:check
      - run: pnpm package:smoke
      - run: pnpm knip
      # Every gate above passed on the v4.0.0 tag and this step still failed:
      # `404 Not Found - PUT`, which is what npm answers an unauthenticated
      # publish. `setup-node` writes an .npmrc reading `${NODE_AUTH_TOKEN}`, and
      # nothing was putting a token there — so the workflow could not have
      # published even with the secret set. 4.0.0 went out from a laptop, the
      # same way 3.1.0 did.
      #
      # Wired now, so the automation works the moment a credential exists. Two
      # ways to give it one, either is enough:
      #
      #   - Trusted publishing: on npmjs.com, under the package's Settings,
      #     link this repository and `release.yml`. npm then accepts the OIDC
      #     identity from `id-token: write` above and no secret is needed. This
      #     is the better one — nothing long-lived to leak or rotate.
      #   - Or add an automation token as the `NPM_TOKEN` repository secret.
      #
      # Until then this step fails and the tag is published by hand.
      # No NODE_AUTH_TOKEN. Under trusted publishing the credential is the OIDC
      # identity from `id-token: write` above, and writing an empty `_authToken`
      # into .npmrc is the thing that stops it being used. If you ever go back
      # to a token, restore the env block and pin pnpm >= 10.30.2 so the two
      # cannot fight.
      - run: pnpm publish --access public --provenance --no-git-checks
