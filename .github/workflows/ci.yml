name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
      - run: pnpm typecheck
      - run: pnpm lint
      # Before the suite, not after it: part of the suite inspects the built
      # package — that its bin runs under its own shebang and reports the
      # version this repo declares. Built last, those tests were asserting
      # against a `dist` that did not exist yet. Nobody saw it, because the
      # audit step above was failing first and the suite never ran at all.
      - run: pnpm build
      - run: pnpm coverage
      - run: pnpm coverage:critical
      - run: pnpm schema:check
      - run: pnpm docs:check
      - run: pnpm package:smoke
      - run: pnpm knip
